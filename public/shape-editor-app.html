<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Editor</title>
    <style>
        .border {
            border: 1px solid gray;
            padding: 1rem;
        }

        .h-box {
            display: flex;
            gap: 1rem;
            width: 100%;
            justify-content: center;
        }

        .v-box {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
        }
    </style>
    <script type="module" src="build/shape-editor-app.js"></script>
</head>

<body>

<!-- 
    canvas - tässä näytetään muodot.
    palette - palettia käytetään listaamaan käytettävissä olevat toiminnot.
    properties - kun muoto on valittu, sen ominaisuuksia, kuten väriä, voidaan muuttaa täältä.
    status - näyttää tietoja sovelluksen nykytilasta. 
-->
        <div class="h-box">
            <div class="v-box">
                <div id="palette" class="border"></div>
                <div id="properties" class="border"></div>
            </div>
            <div class="border">
                <canvas id="myCanvas" width="800" height="550"></canvas>
            </div>
        </div>
        <div id="status" class="border">Click the canvas to select a shape and change its properties or choose to add a
            shape from Palette</div>
    </div>

</body>

</html>
